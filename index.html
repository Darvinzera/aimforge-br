<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora eDPI Valorant</title>
    <p class="descricao">
Descubra seu eDPI e compare sua sensibilidade com a faixa usada por jogadores competitivos de Valorant.
</p>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>AimForge BR</h1>
<h2>Calculadora de eDPI para Valorant</h2>

        <div class="card">

            <label>DPI</label>
            <input type="number" id="dpi" placeholder="Ex: 800">

            <label>Sensibilidade</label>
            <input type="number" id="sensi" step="0.01" placeholder="Ex: 0.30">

            <button onclick="calcular()">Calcular</button>

            <div id="resultado"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
